packages:
  - web
  - server
  - api/*

# Supply-chain defence: only install package versions published at least a day ago.
minimumReleaseAge: 1440

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  react: 19.1.0
  react-dom: 19.1.0
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

overrides:
  "proxy-addr@^2": "^2.0.8"
  "source-map-js@^1": "^1.2.2"
  "fast-uri@^3": "^3.1.8"
  "brace-expansion@^5": "^5.0.12"
  esbuild: "0.28.2"
  # orval pins js-yaml to an exact version older than the CVE fix (>=4.3.2)
  js-yaml: '4.3.2'
